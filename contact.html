    <script>
        async function updateImages() {
            const dbName = "SafaricomSaritDB";
            const storeName = "images";
            const request = indexedDB.open(dbName, 3);
            request.onupgradeneeded = (e) => {
                const db = e.target.result;
                if (!db.objectStoreNames.contains(storeName)) {
                    const store = db.createObjectStore(storeName);
                    store.createIndex("section", "section", { unique: false });
                } else {
                    const store = e.currentTarget.transaction.objectStore(storeName);
                    if (!store.indexNames.contains("section")) store.createIndex("section", "section", { unique: false });
                }
            };
            request.onsuccess = (e) => {
                const db = e.target.result;
                const tx = db.transaction(storeName, "readonly");
                const store = tx.objectStore(storeName);
                
                const applyData = (el, data, type) => {
                    if (!data) return;
                    const isObj = typeof data === 'object';
                    const val = isObj ? (type === 'img' ? data.image : data.text) : data;
                    if (!val) return;
                    if (type === 'img') {
                        if (el.tagName === 'IMG') {
                            el.src = val;
                            if (isObj && data.text) el.alt = data.text;
                        }
                        else el.style.backgroundImage = `url(${val})`;
                    } else {
                        el.innerText = val;
                    }
                };

                document.querySelectorAll('[data-img-id]').forEach(el => {
                    const req = store.get(el.dataset.imgId);
                    req.onsuccess = () => applyData(el, req.result, 'img');
                });

                document.querySelectorAll('[data-txt-id]').forEach(el => {
                    const req = store.get(el.dataset.txtId);
                    req.onsuccess = () => applyData(el, req.result, 'txt');
                });
            };
        }
        window.addEventListener('load', updateImages);
    </script>
</body>
